name: gates

# The gates, and the gate over the gates. `check_ci_coverage.py` asserts that
# every `scripts/check_*.py` is named by a pull-request-triggered workflow, so a
# future gate may keep its own file or join this one — what it may not do is ship
# a checker nothing runs, which is exactly how `check_delegation_grants.py`
# arrived here with green tests and no coverage of this repo.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts
      - run: python3 scripts/check_ci_coverage.py
      - run: python3 scripts/check_delegation_grants.py
      - run: python3 scripts/check_doc_actions.py
      # No `claude` on this runner, so every declared MCP server comes back
      # unprobed: the gate charges the server half of each grant and says, per
      # server, that the tool half went unverified. Installing the CLI here would
      # buy that half back — `platform.yml` is the workflow that installs it, and
      # the one place that decision belongs.
      - run: python3 scripts/check_mcp_grants.py
      - run: python3 scripts/check_plugin_agents.py
