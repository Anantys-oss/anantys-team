name: templates

# Its own file rather than a line in a shared `gates` job: this gate rules on the
# artifacts the skills write into a user's repo, and those are checked whether or
# not the plugin-manifest gates are in the tree yet.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # `check_template_fields` splits error from warning on the merge-base with
        # `main`. The default shallow checkout has no merge-base, which degrades
        # every mismatch to a warning — the gate says so, but a gate that reports
        # its own blindness is still blind.
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s scripts
      - run: python3 scripts/check_template_paths.py
      - run: python3 scripts/check_template_fields.py
