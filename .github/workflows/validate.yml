name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The default shallow checkout has no origin/main, so the load check would
          # fall back to an absolute total it cannot attribute to this PR.
          fetch-depth: 0
      - run: python3 scripts/check_plugins.py
      # Runs here because a `.gitignore` arriving on another branch is what makes this
      # class silent, and `validate` is the job every pull_request already triggers.
      - run: python3 scripts/check_tracked_ignored.py
      # The gates above decide what fails; these are the only thing that says they
      # decide it correctly. Severity in particular is testable and invisible in a
      # green run, so an untested gate reports whatever it happens to do.
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
