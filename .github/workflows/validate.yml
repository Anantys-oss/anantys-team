name: validate

# The repo's first check. Eight checkers in `scripts/` were written to gate this
# marketplace and every one of them lives on an unmerged branch, so `main` is
# validated by nothing: a malformed `marketplace.json`, a plugin whose `source:`
# points at a directory that was moved, or a role whose frontmatter no longer
# parses all merge green today.
#
# This file deliberately runs no checker of ours. `claude plugin validate` is the
# loader itself — the same code that decides whether a user's `/plugin install`
# succeeds — so it is the one gate that cannot drift from the thing it checks.
# It reads local files only: no auth, no network, no credential.
#
# Not --strict: the marketplace has carried a missing-author warning since before
# this file existed, and reddening every PR over it teaches people to ignore the
# check. Errors fail the job; warnings are printed.
#
# One target is not enough. `claude plugin validate <path>` picks its mode from
# what it finds, and each mode reads exactly one thing:
#
#   - a marketplace manifest -> that file. `"contents": []`.
#   - a plugin manifest      -> that file. `"contents": []`.
#   - a directory with no manifest in it -> the components under it.
#
# So `validate .` resolves to `.claude-plugin/marketplace.json` and never opens a
# skill, an agent, or even a `plugin.json`. Deleting the whole plugin tree leaves
# it reporting success with *fewer* warnings than before, because the author
# warning it used to print came from the `plugin.json` it can no longer read.
#
# Hence the loop: the marketplace manifest, then for every local `source:` the
# plugin manifest and each component directory. Manifests are named by file path,
# never by their directory — a directory whose manifest is missing silently falls
# through to component mode and passes.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      - name: validate the marketplace, then every plugin it lists
        run: |
          set -euo pipefail
          claude plugin validate .claude-plugin/marketplace.json
          # Non-string sources are remote (github, git); they have no local tree here.
          for s in $(jq -r '.plugins[].source | select(type == "string")' .claude-plugin/marketplace.json); do
            [ -d "$s" ] || { echo "::error::marketplace source not found: $s"; exit 1; }
            claude plugin validate "$s/.claude-plugin/plugin.json"
            for c in skills agents commands; do
              if [ -d "$s/$c" ]; then claude plugin validate "$s/$c"; fi
            done
          done
