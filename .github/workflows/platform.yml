name: platform

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `claude plugin validate` reads local files only — no auth, no network,
      # verified against an empty HOME and a scrubbed environment.
      - run: npm install -g @anthropic-ai/claude-code
      # The suite runs once, in `gates` — see the note in validate.yml. It does not
      # need the CLI installed above: every test mocks `subprocess.run`, so the only
      # thing this job uniquely provides is the real loader for the gate below.
      # Not --strict: the marketplace has carried a missing-author warning since
      # before this gate existed, and reddening every PR over it would teach
      # people to ignore the gate. Errors fail; warnings are printed.
      - run: python3 scripts/check_platform.py
      # The other half of "ask the loader": `check_platform` asks what `plugin
      # validate` rules on, this one asks what the session actually registered.
      # It belongs in this job and no other — it is the second gate that needs a
      # real CLI, and the readout it reads is emitted before the first model call,
      # so it costs no token and needs no credential on this runner.
      - run: python3 scripts/check_registry.py
