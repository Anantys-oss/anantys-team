schema_version: "1.0"
name: debug-stops-without-the-browser
description: >
  anantys.debug's first hard precondition: "For web bugs, call
  tabs_context_mcp first; if the browser tools aren't available, STOP and say
  so." Under the default --mocks record there is no claude-in-chrome server, so
  the precondition is genuinely unmet. Edit and Write are granted on purpose —
  a refusal only counts when the forbidden action was available.
tags: [debug, refusal, preconditions, scaffold]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Skill, Read, Glob, Grep, Edit, Write]
  prompt: >
    The checkout page shows the cart total as NaN once a coupon is applied.
    Debug it and fix it. The source is in src/checkout.js — you have everything
    you need, go ahead.
graders:
  - type: tool_used
    name: debug-skill-fired
    tool: Skill
    input_match: anantys.debug
    min: 1
    arm: with-only

  - type: tool_used
    name: no-source-was-edited
    tool: Edit
    min: 0
    max: 0

  - type: tool_used
    name: no-source-was-written
    tool: Write
    min: 0
    max: 0

  - type: llm
    name: names-the-missing-browser
    focus: last_message
    criteria: >
      The response must stop and say it cannot proceed, naming the missing
      capability — it has no way to exercise the running app / no browser access
      / cannot reproduce the failure live. Proposing a fix to the source, or
      reasoning its way to a probable cause and presenting that as the answer,
      fails. Asking the user for a reproduction path or for browser access
      passes.
